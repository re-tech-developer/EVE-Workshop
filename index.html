    if (CONFIG.DEMO_MODE) DemoAPI.thresholds = s;
    const m = document.getElementById('saveMsg');
    m.style.color = 'var(--ok)'; m.textContent = 'Saved';
    setTimeout(()=>m.textContent = '', 2500);
  },

  reset(){
    if (!confirm('Reset settings?')) return;
    Settings.reset();
    this.render();
  }
};

/* ============================================================
   ADMIN
============================================================ */
const AdminPage = {
  render(){
    if (!Auth.isAdmin()){
      document.getElementById('view').innerHTML = `<div class="page"><div class="card"><div class="empty">🔒 Admin access required</div></div></div>`;
      return;
    }
    const c = document.getElementById('view');
    c.innerHTML = `
      <div class="page">
        <div class="grid-4 mobile-2col">
          <div class="card"><div class="kpi-label">Total</div><div class="kpi-value">${State.machines.length}</div></div>
          <div class="card"><div class="kpi-label">Machining</div><div class="kpi-value t-brand">${State.machines.filter(m=>m.metadata?.area==='Machining').length}</div></div>
          <div class="card"><div class="kpi-label">Welding</div><div class="kpi-value" style="color:var(--idle);">${State.machines.filter(m=>m.metadata?.area==='Welding').length}</div></div>
          <div class="card"><div class="kpi-label">Power + Facility</div><div class="kpi-value t-warn">${State.machines.filter(m=>['Power','Facility'].includes(m.metadata?.area)).length}</div></div>
        </div>

        <div class="card">
          <div class="card-head">
            <div class="card-title">Equipment Registry</div>
            <button class="btn btn-primary btn-sm" onclick="AdminPage.openAdd()">+ Add</button>
          </div>
          <div class="table-wrap">
            <table class="data">
              <thead><tr><th>Tag</th><th>Name</th><th>Type</th><th>Area</th><th>Status</th><th></th></tr></thead>
              <tbody id="eqRows"></tbody>
            </table>
          </div>
        </div>
      </div>
    `;
    this.renderTable();
  },

  renderTable(){
    const tb = document.getElementById('eqRows');
    if (!tb) return;
    if (!State.machines.length){
      tb.innerHTML = `<tr><td colspan="6"><div class="empty">No equipment yet</div></td></tr>`;
      return;
    }
    tb.innerHTML = State.machines.map(m=>{
      const s = State.live[m.id]?.status || 'offline';
      return `<tr>
        <td class="mono t-muted" style="font-size:10px;">${esc(m.id)}</td>
        <td><strong>${esc(m.name)}</strong></td>
        <td class="t-muted">${esc(m.type)}</td>
        <td class="t-muted">${esc(m.metadata?.area||'—')}</td>
        <td><span class="led ${s}"></span> <span class="${statusCls(s)}">${s}</span></td>
        <td style="text-align:right;">
          <button class="btn btn-sm" onclick="App.goMachine('${m.id}')">View</button>
          <button class="btn btn-sm btn-danger" onclick="AdminPage.confirmDel('${m.id}')">Delete</button>
        </td>
      </tr>`;
    }).join('');
  },

  openAdd(){
    document.getElementById('modalRoot').innerHTML = `
      <div class="modal-back" onclick="if(event.target===this)AdminPage.close()">
        <div class="modal">
          <div class="modal-head">
            <h3>Add Equipment</h3>
            <button class="btn btn-sm" onclick="AdminPage.close()">✕</button>
          </div>
          <div class="modal-body">
            <div class="field"><label>Asset Tag *</label><input class="mono" id="aTag" placeholder="MW-LT04"></div>
            <div class="field"><label>Name *</label><input id="aName" placeholder="Lathe Machine #04"></div>
            <div class="field"><label>Type *</label>
              <select id="aType" style="width:100%;padding:9px 11px;background:var(--bg);border:1px solid var(--line);border-radius:4px;color:var(--ink);">
                <option value="Lathe">Lathe Machine</option>
                <option value="Milling">Milling Machine</option>
                <option value="Drilling">Drilling Machine</option>
                <option value="Welding">Welding Machine</option>
                <option value="Panel">Electrical Panel</option>
                <option value="Environment">Environment Sensor</option>
              </select>
            </div>
            <div class="field"><label>Area *</label>
              <select id="aArea" style="width:100%;padding:9px 11px;background:var(--bg);border:1px solid var(--line);border-radius:4px;color:var(--ink);">
                <option value="Machining">Machining</option>
                <option value="Welding">Welding</option>
                <option value="Power">Power</option>
                <option value="Facility">Facility</option>
              </select>
            </div>
            <div class="field"><label>Location</label><input id="aLoc" placeholder="Machining Area"></div>
            <div class="field"><label>Bay / Station / Room</label><input id="aBay" placeholder="A4"></div>
            <p id="aErr" style="color:var(--bad);font-size:11px;margin-top:6px;min-height:14px;"></p>
          </div>
          <div class="modal-foot">
            <button class="btn" onclick="AdminPage.close()">Cancel</button>
            <button class="btn btn-primary" onclick="AdminPage.submitAdd()">Add</button>
          </div>
        </div>
      </div>
    `;
  },

  close(){ document.getElementById('modalRoot').innerHTML = ''; },

  async submitAdd(){
    const err = document.getElementById('aErr');
    const tag = document.getElementById('aTag').value.trim();
    const name = document.getElementById('aName').value.trim();
    const type = document.getElementById('aType').value;
    const area = document.getElementById('aArea').value;
    const loc = document.getElementById('aLoc').value.trim();
    const bay = document.getElementById('aBay').value.trim();
    if (!tag || !name){ err.textContent = 'Tag & Name required'; return; }
    if (State.machines.find(m=>m.id === tag)){ err.textContent = 'Tag already exists'; return; }
    const machine = { id:tag, name, type, location: loc || area, metadata:{ area } };
    if (bay) machine.metadata.section = bay;
    try {
      if (CONFIG.DEMO_MODE){
        DemoAPI.addMachine(machine);
        State.machines.push(machine);
        State.live[tag] = DemoAPI.createInitialState(machine);
      } else {
        await api('/machines', { method:'POST', body: JSON.stringify(machine) });
        State.machines.push(machine);
      }
      this.close();
      this.render();
      document.getElementById('tkAssets').textContent = State.machines.length;
    } catch (e){ err.textContent = '⚠ ' + e.message; }
  },

  confirmDel(id){
    const m = State.machines.find(x=>x.id === id);
    if (!m) return;
    document.getElementById('modalRoot').innerHTML = `
      <div class="modal-back" onclick="if(event.target===this)AdminPage.close()">
        <div class="modal" style="max-width:380px;">
          <div class="modal-head"><h3>Delete Equipment</h3><button class="btn btn-sm" onclick="AdminPage.close()">✕</button></div>
          <div class="modal-body">
            <p style="font-size:12px;line-height:1.6;">
              Delete <strong>${esc(m.name)}</strong> (<span class="mono">${esc(m.id)}</span>)?
            </p>
            <p class="t-muted" style="font-size:11px;margin-top:8px;">This cannot be undone.</p>
          </div>
          <div class="modal-foot">
            <button class="btn" onclick="AdminPage.close()">Cancel</button>
            <button class="btn btn-danger" onclick="AdminPage.doDel('${id}')">Delete</button>
          </div>
        </div>
      </div>
    `;
  },

  async doDel(id){
    try {
      if (CONFIG.DEMO_MODE){
        DemoAPI.removeMachine(id);
        State.machines = State.machines.filter(m=>m.id !== id);
        delete State.live[id];
      } else {
        await api(`/machines/${id}`, { method:'DELETE' });
        State.machines = State.machines.filter(m=>m.id !== id);
        delete State.live[id];
      }
      this.close();
      this.render();
      document.getElementById('tkAssets').textContent = State.machines.length;
    } catch(e){ alert(e.message); }
  }
};

/* ============================================================
   DEMO API
============================================================ */
const DemoAPI = {
  machines: [
    { id:'MW-LT01', name:'Lathe Machine #01', type:'Lathe', location:'Machining Area', metadata:{area:'Machining', section:'Lathe', bay:'A1'} },
    { id:'MW-LT02', name:'Lathe Machine #02', type:'Lathe', location:'Machining Area', metadata:{area:'Machining', section:'Lathe', bay:'A2'} },
    { id:'MW-LT03', name:'Lathe Machine #03', type:'Lathe', location:'Machining Area', metadata:{area:'Machining', section:'Lathe', bay:'A3'} },
    { id:'MW-ML01', name:'Milling Machine #01', type:'Milling', location:'Machining Area', metadata:{area:'Machining', section:'Milling', bay:'B1'} },
    { id:'MW-ML02', name:'Milling Machine #02', type:'Milling', location:'Machining Area', metadata:{area:'Machining', section:'Milling', bay:'B2'} },
    { id:'MW-ML03', name:'Milling Machine #03', type:'Milling', location:'Machining Area', metadata:{area:'Machining', section:'Milling', bay:'B3'} },
    { id:'MW-DR01', name:'Drilling Machine #01', type:'Drilling', location:'Machining Area', metadata:{area:'Machining', section:'Drilling', bay:'C1'} },
    { id:'MW-DR02', name:'Drilling Machine #02', type:'Drilling', location:'Machining Area', metadata:{area:'Machining', section:'Drilling', bay:'C2'} },
    { id:'MW-DR03', name:'Drilling Machine #03', type:'Drilling', location:'Machining Area', metadata:{area:'Machining', section:'Drilling', bay:'C3'} },
    { id:'WA-WM01', name:'Welding Machine #01', type:'Welding', location:'Welding Area', metadata:{area:'Welding', station:'W1'} },
    { id:'WA-WM02', name:'Welding Machine #02', type:'Welding', location:'Welding Area', metadata:{area:'Welding', station:'W2'} },
    { id:'WA-WM03', name:'Welding Machine #03', type:'Welding', location:'Welding Area', metadata:{area:'Welding', station:'W3'} },
    { id:'PW-PN00', name:'Main Distribution Panel', type:'Panel', location:'Electrical Room', metadata:{area:'Power', subtype:'Main'} },
    { id:'PW-PN01', name:'Hydraulic System Panel', type:'Panel', location:'Machining Area', metadata:{area:'Power', subtype:'Hydraulic'} },
    { id:'PW-PN02', name:'Machining Section Panel', type:'Panel', location:'Machining Area', metadata:{area:'Power', subtype:'Machining'} },
    { id:'PW-PN03', name:'Workbench & Project Panel', type:'Panel', location:'Workshop Hall', metadata:{area:'Power', subtype:'Workbench'} },
    { id:'PW-PN04', name:'Office Distribution Panel', type:'Panel', location:'Office Area', metadata:{area:'Power', subtype:'Office'} },
    { id:'FA-EN01', name:'Office Env Sensor', type:'Environment', location:'Office', metadata:{area:'Facility', room:'Office'} },
    { id:'FA-EN02', name:'Classroom Env Sensor', type:'Environment', location:'Classroom', metadata:{area:'Facility', room:'Classroom'} },
    { id:'FA-EN03', name:'Toolroom Env Sensor', type:'Environment', location:'Toolroom', metadata:{area:'Facility', room:'Toolroom'} },
    { id:'FA-EN04', name:'Meeting Room Env Sensor', type:'Environment', location:'Meeting Room', metadata:{area:'Facility', room:'Meeting Room'} },
    { id:'FA-EN05', name:'Module Room Env Sensor', type:'Environment', location:'Module Room', metadata:{area:'Facility', room:'Module Room'} }
  ],
  state: {}, alarms: [], alarmId: 1, simulated: false, historyCache: {}, thresholds: null,

  createInitialState(m){
    const b = { lastSeen: new Date().toISOString() };
    switch(m.type){
      case 'Lathe': Object.assign(b, { status:['running','running','idle'][Math.floor(Math.random()*3)], rpm:1200+Math.random()*800, temp:40+Math.random()*20, vibration:1+Math.random()*2 }); break;
      case 'Milling': Object.assign(b, { status:['running','running','idle'][Math.floor(Math.random()*3)], rpm:2000+Math.random()*1500, temp:45+Math.random()*20, vibration:1.5+Math.random()*2 }); break;
      case 'Drilling': Object.assign(b, { status:['running','idle'][Math.floor(Math.random()*2)], rpm:800+Math.random()*600, temp:38+Math.random()*15, vibration:1+Math.random()*2.5 }); break;
      case 'Welding': Object.assign(b, { status:['running','idle','running'][Math.floor(Math.random()*3)], voltage:20+Math.random()*5, current:80+Math.random()*60, arc_status:Math.random()>0.4?'ON':'OFF' }); break;
      case 'Panel': Object.assign(b, { status:'running',
        voltage_r:220+Math.random()*5, voltage_s:219+Math.random()*5, voltage_t:221+Math.random()*5,
        current_r:50+Math.random()*15, current_s:52+Math.random()*15, current_t:48+Math.random()*15,
        power_kwh:1200+Math.random()*300 }); break;
      case 'Environment': Object.assign(b, { status:'running', temp:24+Math.random()*6, humidity:50+Math.random()*25 }); break;
    }
    return b;
  },

  init(){
    if (Object.keys(this.state).length) return;
    this.machines.forEach(m => this.state[m.id] = this.createInitialState(m));
    this.alarms = [
      { id:this.alarmId++, machine_id:'MW-DR02', severity:'warning', message:'High vibration detected', value:4.7, status:'active', raised_at:new Date(Date.now()-180000).toISOString(), machine_name:'Drilling Machine #02' },
      { id:this.alarmId++, machine_id:'PW-PN00', severity:'critical', message:'Phase R voltage low', value:198, status:'active', raised_at:new Date(Date.now()-90000).toISOString(), machine_name:'Main Distribution Panel' }
    ];
  },

  addMachine(m){ if (this.machines.find(x=>x.id === m.id)) throw new Error('Tag exists'); this.machines.push(m); this.state[m.id] = this.createInitialState(m); },
  removeMachine(id){ this.machines = this.machines.filter(m => m.id !== id); delete this.state[id]; },

  async handle(path, opts = {}){
    await new Promise(r => setTimeout(r, 20));
    const method = opts.method || 'GET';

    if (path === '/machines'){
      if (method === 'POST'){ const b = JSON.parse(opts.body); this.addMachine(b); return b; }
      return this.machines;
    }
    if (path.startsWith('/machines/') && method === 'DELETE'){ this.removeMachine(path.split('/')[2]); return { ok:true }; }

    if (path === '/telemetry/status/all'){
      const out = [];
      this.machines.forEach(m=>{
        const s = this.state[m.id]; if (!s) return;
        out.push({ machine_id:m.id, metric:'status', text_value:s.status, time:s.lastSeen });
        ['rpm','temp','vibration','voltage','current','arc_status',
         'voltage_r','voltage_s','voltage_t','current_r','current_s','current_t',
         'power_kwh','humidity'].forEach(k=>{
          if (s[k] !== undefined && s[k] !== null){
            out.push({ machine_id:m.id, metric:k,
              value: typeof s[k] === 'number' ? s[k] : null,
              text_value: typeof s[k] === 'string' ? s[k] : null,
              time:s.lastSeen });
          }
        });
      });
      return out;
    }
    if (path.startsWith('/telemetry/') && path.includes('?')){
      const mid = path.match(/\/telemetry\/([^?]+)/)[1];
      const metric = new URLSearchParams('?'+path.split('?')[1]).get('metric') || 'temp';
      return this.getHistory(mid, metric);
    }
    if (path.startsWith('/alarms?')){
      const st = new URLSearchParams('?'+path.split('?')[1]).get('status') || 'active';
      return this.alarms.filter(a => a.status === st);
    }
    if (path.match(/^\/alarms\/\d+\/ack$/) && method === 'POST'){
      if (!Auth.canOperate()) throw new Error('Forbidden');
      const id = +path.split('/')[2];
      const a = this.alarms.find(x=>x.id === id);
      if (a){ a.status = 'acknowledged'; a.ack_at = new Date().toISOString(); }
      return a || {};
    }
    if (path === '/alarms/rules') return [];
    if (path === '/oee/summary/plant'){
      return this.machines.filter(m => m.type !== 'Panel').map(m=>({
        machine_id: m.id,
        oee: 60 + Math.random()*35,
        availability: 80 + Math.random()*19,
        performance: 70 + Math.random()*28,
        quality: 90 + Math.random()*9
      }));
    }
    if (path.startsWith('/oee/')){
      const id = path.match(/\/oee\/([^?]+)/)[1];
      const days = [];
      for (let i=6; i>=0; i--){
        days.push({ bucket:new Date(Date.now()-i*86400000).toISOString(), machine_id:id,
          avg_oee: 65+Math.random()*30, avg_availability: 82+Math.random()*15,
          avg_performance: 72+Math.random()*25, avg_quality: 92+Math.random()*7 });
      }
      return days;
    }
    throw new Error('Demo: unknown path ' + path);
  },

  getHistory(machineId, metric){
    const key = `${machineId}:${metric}`;
    if (this.historyCache[key]) return this.historyCache[key];
    const pts = [];
    let base = 45, noise = 15;
    if (metric === 'rpm'){ base = 1500; noise = 600; }
    else if (metric === 'vibration'){ base = 2.5; noise = 2; }
    else if (metric === 'voltage'){ base = 22; noise = 3; }
    else if (metric === 'current'){ base = 120; noise = 30; }
    else if (metric === 'voltage_r'){ base = 220.5; noise = 3; }
    else if (metric === 'voltage_s'){ base = 219.8; noise = 3; }
    else if (metric === 'voltage_t'){ base = 221.2; noise = 3; }
    else if (metric === 'current_r'){ base = 55; noise = 8; }
    else if (metric === 'current_s'){ base = 53; noise = 8; }
    else if (metric === 'current_t'){ base = 57; noise = 8; }
    else if (metric === 'humidity'){ base = 60; noise = 15; }
    else if (metric === 'power_kwh'){ base = 1300; noise = 30; }

    for (let i=199; i>=0; i--){
      let v;
      if (metric === 'power_kwh') v = base + (199-i)*0.4 + (Math.random()-0.5)*noise*0.3;
      else v = base + (Math.random()-0.5)*noise;
      pts.push({ bucket: new Date(Date.now()-i*5*60000).toISOString(), avg_value: v });
    }
    this.historyCache[key] = pts;
    return pts;
  },

  startSimulator(){
    if (this.simulated) return;
    this.simulated = true;
    setInterval(()=>{
      this.machines.forEach(m=>{
        const s = this.state[m.id];
        if (!s) return;
        s.lastSeen = new Date().toISOString();
        const th = this.thresholds || Settings.get();

        switch(m.type){
          case 'Lathe': case 'Milling': case 'Drilling':
            s.rpm = Math.max(0, Math.min(3500, s.rpm + (Math.random()-0.5)*80));
            s.temp = Math.max(25, Math.min(95, s.temp + (Math.random()-0.5)*1.2));
            s.vibration = Math.max(0.1, Math.min(8, s.vibration + (Math.random()-0.5)*0.15));
            if (Math.random() < 0.01){
              s.status = ['running','running','running','idle','error'][Math.floor(Math.random()*5)];
              App.onTele({ machineId:m.id, metric:'status', textValue:s.status, time:s.lastSeen });
            }
            App.onTele({ machineId:m.id, metric:'rpm', value:s.rpm });
            App.onTele({ machineId:m.id, metric:'temp', value:s.temp });
            App.onTele({ machineId:m.id, metric:'vibration', value:s.vibration });
            if (s.vibration > th.vibrationWarning && Math.random() < 0.01){
              const a = { id:this.alarmId++, machine_id:m.id, severity: s.vibration > th.vibrationCritical ? 'critical':'warning',
                message:`High vibration (${s.vibration.toFixed(2)} mm/s)`, value:s.vibration, status:'active',
                raised_at:new Date().toISOString(), machine_name:m.name };
              this.alarms.unshift(a); App.onAlarm(a);
            }
            break;

          case 'Welding':
            s.voltage = Math.max(15, Math.min(30, s.voltage + (Math.random()-0.5)*0.6));
            s.current = Math.max(50, Math.min(180, s.current + (Math.random()-0.5)*6));
            s.arc_status = Math.random() > 0.3 ? 'ON' : 'OFF';
            App.onTele({ machineId:m.id, metric:'voltage', value:s.voltage });
            App.onTele({ machineId:m.id, metric:'current', value:s.current });
            App.onTele({ machineId:m.id, metric:'arc_status', textValue:s.arc_status });
            break;

          case 'Panel':
            s.voltage_r = Math.max(200, Math.min(235, s.voltage_r + (Math.random()-0.5)*1.2));
            s.voltage_s = Math.max(200, Math.min(235, s.voltage_s + (Math.random()-0.5)*1.2));
            s.voltage_t = Math.max(200, Math.min(235, s.voltage_t + (Math.random()-0.5)*1.2));
            s.current_r = Math.max(20, Math.min(120, s.current_r + (Math.random()-0.5)*2));
            s.current_s = Math.max(20, Math.min(120, s.current_s + (Math.random()-0.5)*2));
            s.current_t = Math.max(20, Math.min(120, s.current_t + (Math.random()-0.5)*2));
            s.power_kwh += Math.random()*0.4;
            ['voltage_r','voltage_s','voltage_t','current_r','current_s','current_t','power_kwh']
              .forEach(k => App.onTele({ machineId:m.id, metric:k, value:s[k] }));
            break;

          case 'Environment':
            s.temp = Math.max(20, Math.min(35, s.temp + (Math.random()-0.5)*0.25));
            s.humidity = Math.max(40, Math.min(85, s.humidity + (Math.random()-0.5)*0.6));
            App.onTele({ machineId:m.id, metric:'temp', value:s.temp });
            App.onTele({ machineId:m.id, metric:'humidity', value:s.humidity });
            break;
        }
      });
      App.setLive(true);
      const el = document.getElementById('tkOee');
      if (el) el.textContent = (72 + Math.random()*18).toFixed(1)+'%';
    }, 2000);
  }
};

document.addEventListener('DOMContentLoaded', ()=> App.init());
</script>
